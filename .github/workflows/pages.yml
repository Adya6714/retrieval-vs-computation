name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'site/data/**'
      - 'scripts/site/**'
      - 'tests/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build pipeline explorer data
        run: |
          PYTHONPATH=. python scripts/site/build_pipeline_explorer_data.py
          PYTHONPATH=. python -m pytest tests/site -q
      - name: Stamp last-built date
        run: |
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/Last built: [0-9-]*/Last built: ${DATE}/" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
